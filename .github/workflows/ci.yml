name: CI

# Behaviour tests only: unit tests plus end-to-end tests that drive the real programs with
# real input (keyboard, mouse, gamepad) and assert on what happened. Layout/visual checks
# are run manually offline with tests/layout_shots.sh.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cc: gcc
          - name: Linux (Clang)
            os: ubuntu-latest
            cc: clang
          - name: macOS (Apple Clang)
            os: macos-latest
            cc: clang
          - name: Windows (MSVC)
            os: windows-latest
            cc: cl
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (raylib needs X11/GL/ALSA headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libxtst6 xvfb tmux

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cc }}" = "cl" ]; then
            cmake -S . -B build
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }}
          fi

      - name: Build (core, tests, terminal version, GUI version)
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: GUI end-to-end test (Linux, XTest keyboard + mouse)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          XINJ_SCALE: "2"
        run: tests/e2e_gui.sh build

      - name: Gamepad end-to-end test (Linux, virtual Xbox 360 pad via uinput)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: sudo -E env "PATH=$PATH" XINJ_SCALE=2 tests/e2e_gamepad.sh build

      - name: Terminal version end-to-end test (tmux)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          XINJ_SCALE: "2"
        run: |
          command -v tmux >/dev/null || brew install tmux
          tests/e2e_tui.sh build

      - name: GUI end-to-end test (Windows, SendInput keyboard + mouse)
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        env:
          XINJ_SCALE: "2"
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Hosted Windows has no GPU driver: use Mesa's software OpenGL (llvmpipe) next to caro.exe
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.8/mesa3d-26.1.8-release-msvc.7z" -OutFile "$env:RUNNER_TEMP\mesa.7z"
          7z x "$env:RUNNER_TEMP\mesa.7z" -o"$env:RUNNER_TEMP\mesa" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\mesa\x64\*.dll" build\Release\
          tests/e2e_gui_windows.ps1 -Dir "$PWD\build\Release"

      - name: Terminal version end-to-end test (Windows ConPTY)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          XINJ_SCALE: "2"
        run: |
          python -m pip install --quiet pywinpty pyte
          python tests/e2e_tui_windows.py build/Release/caro_tui.exe

  windows-mingw:
    name: Windows (MinGW-w64 GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
